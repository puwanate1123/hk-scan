<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1E1E">
<title>สแกนคิวอาร์โค้ด · ระบบตรวจงานแม่บ้าน</title>
<!--
  ============================================================
  หน้าสแกนคิวอาร์โค้ด — ใช้คู่กับระบบตรวจงานแม่บ้าน
  ------------------------------------------------------------
  ทำไมต้องแยกหน้านี้ออกมา:
    หน้าเว็บของ Google Apps Script ถูกฝังในกรอบที่ไม่อนุญาตให้ใช้กล้อง
    หน้านี้วางบนเว็บอื่น (เช่น GitHub Pages) จึงเปิดกล้องได้
  การทำงาน:
    เปิดกล้อง → อ่านคิวอาร์โค้ดหน้าห้อง → พากลับเข้าระบบที่ห้องนั้นทันที
  หน้านี้ไม่เก็บและไม่ส่งข้อมูลใด ๆ ระบบหลักยังตรวจสิทธิ์ทุกครั้งเหมือนเดิม

  ⚙️ ตั้งค่าครั้งเดียว: วางลิงก์เว็บแอป (ลงท้ายด้วย /exec) ในบรรทัด APP_URL ด้านล่าง
  ============================================================
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap');
:root { --red: #7A1C22; --gold: #D4A72C; --ink: #2B2B2B; --muted: #5C5C5C; --line: #E2DCCF; --cream: #F6F0E4; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'IBM Plex Sans Thai', Tahoma, sans-serif; background: #1E1E1E; color: #fff;
  display: flex; flex-direction: column; min-height: 100%;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, a.btn { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
.back {
  width: 46px; height: 46px; border-radius: 23px; border: 0; background: rgba(255, 255, 255, .12); color: #fff;
  display: flex; align-items: center; justify-content: center; text-decoration: none;
}
.back svg { width: 24px; height: 24px; }
.top h1 { font-size: 19px; font-weight: 600; }
.main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 16px 24px; }
.frame { position: relative; width: 300px; height: 300px; max-width: 82vw; max-height: 82vw; border-radius: 24px; background: #2E2E2E; overflow: hidden; }
.frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cn { position: absolute; width: 58px; height: 58px; border: 0 solid var(--gold); z-index: 2; }
.tl { left: 0; top: 0; border-left-width: 5px; border-top-width: 5px; border-top-left-radius: 24px; }
.tr { right: 0; top: 0; border-right-width: 5px; border-top-width: 5px; border-top-right-radius: 24px; }
.bl { left: 0; bottom: 0; border-left-width: 5px; border-bottom-width: 5px; border-bottom-left-radius: 24px; }
.br { right: 0; bottom: 0; border-right-width: 5px; border-bottom-width: 5px; border-bottom-right-radius: 24px; }
.line {
  position: absolute; left: 24px; right: 24px; top: 50%; height: 3px; border-radius: 2px; z-index: 2;
  background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: move 1.8s ease-in-out infinite alternate;
}
@keyframes move { from { top: 16%; } to { top: 84%; } }
@media (prefers-reduced-motion: reduce) { .line { animation: none; } }
.msg {
  position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center; font-size: 17px; line-height: 1.5; background: rgba(30, 30, 30, .88);
}
.msg:empty { display: none; }
.caption { text-align: center; display: flex; flex-direction: column; gap: 4px; }
.caption b { font-size: 21px; font-weight: 600; }
.caption span { font-size: 16px; color: #CFCFCF; }
.sheet { background: #fff; color: var(--ink); border-radius: 24px 24px 0 0; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 10px; }
.sheet small { font-size: 15px; color: var(--muted); }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 58px;
  border: 2px solid transparent; border-radius: 16px; font-size: 19px; font-weight: 700; text-decoration: none;
}
.btn svg { width: 24px; height: 24px; }
.btn-red { background: var(--red); color: #fff; }
.btn-light { background: #fff; color: var(--ink); border-color: var(--line); }
.row { display: flex; gap: 10px; }
.row .btn { flex: 1; }
.done {
  position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: var(--red); color: #fff; text-align: center; padding: 24px;
}
.done.show { display: flex; }
.done .ok { width: 110px; height: 110px; border-radius: 55px; background: var(--gold); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.done .ok svg { width: 56px; height: 56px; }
.done b { font-size: 30px; }
.done span { font-size: 18px; opacity: .9; }
#toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 20; width: 92%; max-width: 480px; transform: translate(-50%, 200%);
  padding: 15px 18px; border-radius: 16px; background: var(--red); color: #fff; font-size: 17px; font-weight: 600; text-align: center;
  transition: transform .25s;
}
#toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="top">
  <a class="back" id="back" href="#" aria-label="กลับหน้าหลัก">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <h1>สแกนคิวอาร์โค้ดหน้าห้อง</h1>
</div>

<div class="main">
  <div class="frame">
    <video id="video" playsinline muted autoplay></video>
    <span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span>
    <span class="line"></span>
    <div class="msg" id="msg">กำลังเปิดกล้อง...</div>
  </div>
  <div class="caption"><b>เล็งกล้องไปที่คิวอาร์โค้ด</b><span>ระบบจะเปิดห้องให้อัตโนมัติ</span></div>
</div>

<div class="sheet">
  <small>กล้องใช้ไม่ได้? ถ่ายรูปคิวอาร์โค้ดแทน</small>
  <div class="row">
    <label class="btn btn-red">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      ถ่ายรูปคิวอาร์โค้ด
      <input type="file" accept="image/*" capture="environment" id="photo" hidden>
    </label>
    <button class="btn btn-light" id="torch" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span id="torch-text">ไฟฉาย</span>
    </button>
  </div>
</div>

<div class="done" id="done">
  <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
  <b id="done-room">ห้อง</b>
  <span>กำลังเปิดห้อง...</span>
</div>
<div id="toast" role="alert"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
/* ⚙️ วางลิงก์เว็บแอปของระบบตรงนี้ (ลิงก์เดียวกับที่ใช้สร้างคิวอาร์โค้ด ลงท้ายด้วย /exec) */
var APP_URL = 'https://script.google.com/macros/s/AKfycbxvHQpGGFG4ik36bQ41Gv1NlROlNu_QJKPSyU0Yxq-EbZMm2VO1u3LO8rlD35v2jKeIiw/exec';

/* ---------------- ตรวจลิงก์ในคิวอาร์โค้ด ---------------- */

/** รหัสเว็บแอปจากลิงก์ (ใช้เทียบว่าคิวอาร์โค้ดเป็นของระบบเราจริง) */
function appId(url) {
  var m = /\/s\/([A-Za-z0-9_\-]+)\/(exec|dev)/.exec(String(url || ''));
  return m ? m[1] : '';
}
var APP_ID = appId(APP_URL);

/**
 * คืนลิงก์ที่จะพาไป หรือ '' ถ้าไม่ใช่คิวอาร์โค้ดของระบบ
 * รับได้ 2 แบบ: ลิงก์ระบบ ...?room=ROOM-1205 หรือรหัสห้องอย่างเดียว ROOM-1205
 * ไม่พาไปเว็บอื่นเด็ดขาด (กันคิวอาร์โค้ดปลอม)
 */
function targetFor(text) {
  text = String(text || '').trim();
  var room = '';
  if (/^https:\/\//i.test(text)) {
    if (/^https:\/\/script\.google\.com\//i.test(text) && APP_ID && appId(text) === APP_ID) {
      var m = /[?&]room=([^&#\s]+)/.exec(text);
      room = m ? decodeURIComponent(m[1]) : '';
    }
  } else {
    room = text;
  }
  if (!/^[0-9A-Za-z\-]{1,20}$/.test(room)) return null;
  return { room: room, url: APP_URL.split('?')[0] + '?room=' + encodeURIComponent(room) };
}

/* ---------------- กล้อง ---------------- */

var S = { stream: null, timer: null, detector: null, busy: false, torch: false, lastBad: 0, done: false };
var canvas = document.createElement('canvas');

function $(id) { return document.getElementById(id); }

function toast(text) {
  var t = $('toast');
  t.textContent = text;
  t.className = 'show';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { t.className = ''; }, 3500);
}

function startCamera() {
  if (S.done) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return failed('เบราว์เซอร์นี้เปิดกล้องไม่ได้ กดปุ่ม "ถ่ายรูปคิวอาร์โค้ด" ด้านล่างแทน');
  }
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
  }).then(function (stream) {
    S.stream = stream;
    var v = $('video');
    v.srcObject = stream;
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
    $('msg').textContent = '';
    try {
      var caps = stream.getVideoTracks()[0].getCapabilities();
      if (caps && caps.torch) $('torch').hidden = false;
    } catch (e) { /* ไม่มีไฟฉาย */ }
    prepareDetector();
    S.timer = setInterval(tick, 200);
  }).catch(function (err) {
    var denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    failed(denied
      ? 'ยังไม่ได้อนุญาตให้ใช้กล้อง กดรูปแม่กุญแจข้างแถบที่อยู่เว็บ แล้วอนุญาต "กล้อง" จากนั้นโหลดหน้านี้ใหม่'
      : 'เปิดกล้องไม่ได้ กดปุ่ม "ถ่ายรูปคิวอาร์โค้ด" ด้านล่างแทน');
  });
}

function failed(text) {
  stopCamera();
  $('msg').textContent = text;
}

function stopCamera() {
  if (S.timer) clearInterval(S.timer);
  S.timer = null;
  if (S.stream) S.stream.getTracks().forEach(function (t) { t.stop(); });
  S.stream = null;
  S.busy = false;
  S.torch = false;
}

/** ใช้ตัวอ่านคิวอาร์โค้ดในเครื่องถ้ามี (เร็วกว่า) ไม่มีใช้ jsQR */
function prepareDetector() {
  if (!('BarcodeDetector' in window) || !window.BarcodeDetector.getSupportedFormats) return;
  window.BarcodeDetector.getSupportedFormats().then(function (f) {
    if (f.indexOf('qr_code') > -1) S.detector = new window.BarcodeDetector({ formats: ['qr_code'] });
  }).catch(function () {});
}

function decode(source, w, h, max, inversion) {
  if (!window.jsQR) return '';
  var s = Math.min(1, max / Math.max(w, h));
  canvas.width = Math.round(w * s);
  canvas.height = Math.round(h * s);
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
  var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  var code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: inversion });
  return code && code.data ? code.data : '';
}

function tick() {
  var v = $('video');
  if (S.busy || S.done || v.readyState < 2 || !v.videoWidth) return;
  S.busy = true;
  if (S.detector) {
    S.detector.detect(v).then(function (codes) {
      S.busy = false;
      if (codes && codes.length) found(codes[0].rawValue);
    }).catch(function () { S.detector = null; S.busy = false; });
    return;
  }
  var text = decode(v, v.videoWidth, v.videoHeight, 640, 'dontInvert');
  S.busy = false;
  if (text) found(text);
}

function found(text) {
  if (S.done) return;
  var t = targetFor(text);
  if (!t) {
    if (Date.now() - S.lastBad > 3000) {
      S.lastBad = Date.now();
      toast('คิวอาร์โค้ดนี้ไม่ใช่ของห้องในระบบ');
    }
    return;
  }
  S.done = true;
  stopCamera();
  if (navigator.vibrate) navigator.vibrate(80);
  $('done-room').textContent = 'ห้อง ' + t.room.replace(/^ROOM-/i, '');
  $('done').className = 'done show';
  // replace: กดย้อนกลับจากหน้าห้องแล้วจะไม่วนกลับมาหน้าสแกน
  location.replace(t.url);
}

/* ---------------- ถ่ายรูปคิวอาร์โค้ด (สำรอง) ---------------- */

$('photo').addEventListener('change', function () {
  var f = this.files && this.files[0];
  var input = this;
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight;
      var text = decode(img, w, h, 1280, 'attemptBoth') || decode(img, w, h, 800, 'attemptBoth');
      input.value = '';
      if (text) found(text);
      else toast('อ่านคิวอาร์โค้ดในรูปไม่ได้ ถ่ายให้ใกล้ขึ้นและไม่เบลอ แล้วลองใหม่');
    };
    img.onerror = function () { toast('เปิดรูปนี้ไม่ได้ กรุณาถ่ายใหม่'); };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
});

/* ---------------- ไฟฉาย ---------------- */

$('torch').addEventListener('click', function () {
  if (!S.stream) return;
  var next = !S.torch;
  S.stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: next }] }).then(function () {
    S.torch = next;
    $('torch-text').textContent = next ? 'ปิดไฟ' : 'ไฟฉาย';
  }).catch(function () { toast('เปิดไฟฉายไม่ได้'); });
});

/* ---------------- เริ่มต้น ---------------- */

$('back').href = APP_URL;
if (!APP_ID) {
  failed('ยังไม่ได้ตั้งค่าลิงก์เว็บแอปในไฟล์นี้ (บรรทัด APP_URL) กรุณาแจ้งผู้ดูแลระบบ');
} else {
  startCamera();
}

// สลับแอปหรือปิดจอ: ปิดกล้องเพื่อประหยัดแบตเตอรี่ กลับมาแล้วเปิดให้ใหม่
document.addEventListener('visibilitychange', function () {
  if (document.hidden) stopCamera();
  else if (!S.stream && !S.done && APP_ID) startCamera();
});
// กลับมาหน้านี้ด้วยปุ่มย้อนกลับของเบราว์เซอร์
window.addEventListener('pageshow', function (e) {
  if (e.persisted) { S.done = false; $('done').className = 'done'; startCamera(); }
});
</script>
</body>
</html>
